<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 22 Korotkov</title>
    <script type="text/javascript">
        function Pole_kor(a_kor, b_kor) {
            var a = parseFloat(a_kor);
            var b = parseFloat(b_kor);
            var pole = a * b;
            document.getElementById('wyprowadz_pole_kor').value = pole.toFixed(2);
        }
        function obwod_kor(a_kor, b_kor) {
            var a = parseFloat(a_kor);
            var b = parseFloat(b_kor);
            var obwod = 2 * (a + b);
            document.getElementById('wyprowadz_obwod_kor').value = obwod.toFixed(2);
        }
        function okno_zamknij_korotkov() { window.close(); }
    </script>
</head>
<body>
    <h2>Obliczanie pola i obwodu prostokąta</h2>
    <form>
        Podaj a: <input type="text" id="a_dana_kor" size="6"><br><br>
        Podaj b: <input type="text" id="b_dana_kor" size="6"><br><br>
        <input type="button" value="Oblicz pole" onclick="Pole_kor(document.getElementById('a_dana_kor')
            .value, document.getElementById('b_dana_kor').value)"><br><br>
        <input type="button" value="Oblicz obwód" onclick="obwod_kor(document.getElementById('a_dana_kor')
            .value, document.getElementById('b_dana_kor').value)"><br><br>
        Pole: <input type="text" id="wyprowadz_pole_kor" size="10"><br><br>
        Obwód: <input type="text" id="wyprowadz_obwod_kor" size="10"><br><br>
    </form>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_korotkov()">
</body>
</html>
    </textarea>
    <input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
