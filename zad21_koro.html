<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 21 Korotkov</title>
    <script language="JavaScript">
        function V_kor(r, h) {
            r_liczba = parseFloat(r);
            h_liczba = parseFloat(h);
            V_wynik = Math.PI * r_liczba * r_liczba * h_liczba;
            document.getElementsByName('obj')[0].value = V_wynik.toFixed(2);
            alert("V=" + V_wynik.toFixed(2) + " cm^3");
            pokaz1.innerHTML = "V=" + V_wynik.toFixed(2) + " cm^3" + "<br>";
        }
        function Pc_kor(r, h) {
            r_liczba = parseFloat(r);
            h_liczba = parseFloat(h);
            Pc_wynik = 2 * Math.PI * r_liczba * r_liczba + 2 * Math.PI * r_liczba * h_liczba;
            document.getElementsByName('pole')[0].value = Pc_wynik.toFixed(2);
            alert("Pc=" + Pc_wynik.toFixed(2) + " cm^2");
            pokaz2.innerHTML = "Pc=" + Pc_wynik.toFixed(2) + " cm^2";
        }
        function okno_zamknij_korotkov() { window.close(); }
    </script>
</head>
<body>
    Obliczanie V i Pc walca
    <br><br>
    <form name="formularz" action="..." onsubmit="V_kor(this.promien.value, 
        this.wysokosc.value); Pc_kor(this.promien.value, this.wysokosc.value); return false">
        Podaj r= <input size="6" name="promien">
        Podaj h= <input size="6" name="wysokosc">
        <br><br>
        <input TYPE="submit" Value="oblicz">
        <br><br>
        V= <input size="6" name="obj">
        Pc= <input size="6" name="pole">
    </form>
    <table>
        <tr id="pokaz1"></tr>
        <tr id="pokaz2"></tr>
    </table>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_korotkov()">
</body>
</html>
