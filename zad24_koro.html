<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 24 Korotkov</title>
    <script>function okno_zamknij_korotkov() { window.close(); }</script>
    <style> *{ background-color: gray; color: blue;} </style>
</head>
<body>
    <script language="JavaScript">
        var x1_kor = parseFloat(prompt("Podaj x1=", ""));
        var x2_kor = parseFloat(prompt("Podaj x2=", ""));

        document.write("x1 = " + x1_kor 
            + " &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; x2 = " + x2_kor + "<br>");

        var x1_r_kor = (x1_kor * Math.PI) / 180;
        document.write("x1 = " + x1_kor 
            + " &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; x1 = " + x1_r_kor.toFixed(2) + "<br>");

        var y1_kor = 3 * Math.pow(x1_kor,5/7);
        var y2_kor = 2 * Math.cos(x1_r_kor) + 3 * Math.sin(x1_r_kor);
        var y3_kor = Math.pow(Math.pow(x1_kor,5) + 2 * Math.pow(x2_kor,4), 1/3 ) * Math.abs(x1_kor - x2_kor);
        

        document.write("y1 = " + y1_kor.toFixed(2) + "<br>");
        document.write("y2 = " + y2_kor.toFixed(2) + "<br>");
        document.write("y3 = " + y3_kor.toFixed(2) + "<br>");
    </script>
    <br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_korotkov()">
</body>
</html>
